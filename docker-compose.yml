name: lendloop

services:
  convex-backend:
    # Tag = org.opencontainers.image.revision of the image; not every commit has one published.
    image: ghcr.io/convex/convex-backend:${CONVEX_REV:-d1fcbeaf939502a23a0f4b7e9095a12e84866294}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports: ["127.0.0.1:3210:3210", "127.0.0.1:3211:3211"]
    volumes: [convex-data:/convex/data]
    environment:
      # Pinned so the committed dev admin key in .env.example stays valid after `down -v`.
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:?set CONVEX_INSTANCE_NAME in .env}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env}
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      DISABLE_BEACON: "1"
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  convex-dashboard:
    image: ghcr.io/convex/convex-dashboard:${CONVEX_REV:-d1fcbeaf939502a23a0f4b7e9095a12e84866294}
    ports: ["127.0.0.1:6791:6791"]
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex-backend: { condition: service_healthy }

  n8n-postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes: [n8n-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.3@sha256:6723b440354bb8e1395a1ecee12685fe03923f897bf6e4d5bb2c6c2bd2051697
    ports: ["127.0.0.1:5678:5678"]
    # The stock entrypoint only installs custom certificates, so replacing it is safe.
    entrypoint: ["tini", "--", "/bin/sh", "/opt/lendloop/entrypoint.sh"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/opt/lendloop:ro
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-admin@lendloop.local}
      # Dev-only bcrypt of "LendLoop-dev-1"; kept here because .env values are dotenv-expanded by Next.
      N8N_INSTANCE_OWNER_PASSWORD_HASH: $$2a$$10$$XNbgUTjo3PYyql.qysfrAOOm44vRFGgAo0U2S4gfymmnV4S1UsPNK
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-UTC}
      TZ: ${APP_TIMEZONE:-UTC}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # Read only by entrypoint.sh to render credentials; workflows can't see env ($env is blocked).
      CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:?set CONVEX_TO_N8N_SECRET in .env}
      N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET:?set N8N_TO_CONVEX_SECRET in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Rendered into the Error Workflow at start; the alert lands in Mailpit.
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-alerts@lendloop.local}
    depends_on:
      n8n-postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      start_period: 90s

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  convex-data: {}
  n8n-data: {}
  n8n-pg: {}
